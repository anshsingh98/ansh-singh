<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction — Ansh Singh</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f0e8;
      --ink: #1d1d1b;
      --muted: #77736c;
      --red: #e5482e;
      --line: #d9d2c6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 6vw, 60px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      font: 500 11px 'DM Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      display: inline-block;
    }
    .badge {
      font: 500 10px 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 6px 12px;
      border-radius: 50px;
    }
    main {
      max-width: 720px;
      margin: auto 0;
      padding: 40px 0;
    }
    .eyebrow {
      font: 500 11px 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(48px, 8vw, 92px);
      line-height: 0.95;
      letter-spacing: -4px;
      font-weight: 800;
      margin-bottom: 28px;
    }
    h1 em {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--red);
      letter-spacing: -2px;
    }
    p.intro {
      font-size: clamp(16px, 2.2vw, 19px);
      line-height: 1.6;
      color: var(--muted);
      max-width: 520px;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font: 10px 'DM Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .social-links {
      display: flex;
      gap: 20px;
    }
    .social-links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 2px;
      font-weight: 700;
    }
    .social-links a:hover {
      color: var(--red);
      border-color: var(--red);
    }
  </style>
</head>
<body>
  <header>
    <div class="wordmark"><span class="dot"></span> Ansh Singh · Deepika App Developers</div>
    <span class="badge">Rebuilding</span>
  </header>

  <main>
    <p class="eyebrow">Pause / reset</p>
    <h1>Under<br><em>construction.</em></h1>
    <p class="intro">Tidying up the corner, rethinking the code, and putting together something better. Be back shortly.</p>
  </main>

  <footer>
    <span>© 2026 Ansh Singh</span>
    <div class="social-links">
      <a href="mailto:hello@anshsingh.dev">Email ↗</a>
      <a href="https://www.instagram.com/ansh__071845?stkn=NHFoZnlrNDRxcWNj" target="_blank" rel="noreferrer">Instagram ↗</a>
      <a href="https://wa.me/917861923886" target="_blank" rel="noreferrer">WhatsApp ↗</a>
    </div>
  </footer>
</body>
</html>
